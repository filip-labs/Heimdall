spring:
  application:
    name: heimdall

  datasource:
    url: jdbc:postgresql://localhost:5433/heimdall
    username: heimdall
    password: heimdall

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

heimdall:
  vehicle:
    offline-threshold: 30s
    offline-check-interval: 10s
  rollout:
    evaluation-interval: 30s
  kafka:
    enabled: true
    outbox-publish-interval: 1s
    outbox-batch-size: 50
