spring:
  application:
    name: heimdall

  datasource:
    url: jdbc:postgresql://localhost:5433/heimdall
    username: heimdall
    password: heimdall

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # java-jwt also brings Jackson 2; outbox JsonNode values use Jackson 3.
        type:
          json_format_mapper: jackson3

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-fast: false
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        heimdall.rollout.evaluation.duration: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

heimdall:
  security:
    release-signing:
      private-key: ${HEIMDALL_SECURITY_RELEASE_SIGNING_PRIVATE_KEY:}
      key-id: ${HEIMDALL_SECURITY_RELEASE_SIGNING_KEY_ID:}
    vehicle-token:
      secret: ${HEIMDALL_SECURITY_VEHICLE_TOKEN_SECRET:}
      ttl: ${HEIMDALL_SECURITY_VEHICLE_TOKEN_TTL:5m}
  vehicle:
    offline-threshold: 30s
    offline-check-interval: 10s
  rollout:
    evaluation-interval: 30s
  kafka:
    enabled: true
    outbox-publish-interval: 1s
    outbox-batch-size: 50
