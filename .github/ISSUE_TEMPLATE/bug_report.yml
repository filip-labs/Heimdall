name: Bug Report
description: Report a reproducible problem in Heimdall
title: "[Bug]: "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Heimdall. Do not paste secrets, credentials, or private information into logs or other fields.

  - type: textarea
    id: description
    attributes:
      label: Short description
      description: Briefly describe the problem.
      placeholder: What went wrong?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component / area
      options:
        - Backend
        - Vehicle / Connectivity
        - OTA Deployment
        - Software Release
        - Rollout
        - Go Simulator
        - PostgreSQL / Flyway
        - CI / Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Start ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant, sanitized logs or error messages. Remove secrets, credentials, and private information first.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, Java, Go, Docker, PostgreSQL, browser, or commit/version details.
      placeholder: |
        OS:
        Java:
        Go:
        Docker:
        Commit/version:
    validations:
      required: true
