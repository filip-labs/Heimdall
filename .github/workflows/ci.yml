name: Heimdall CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Java tests
        run: ./mvnw test

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: simulator/go.mod
          cache: true
          cache-dependency-path: simulator/go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race detector
        run: go test -race ./...

  m10b-tooling-tests:
    name: M10B Tooling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21 for local JMX fixture tests
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up pinned k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
        with:
          k6-version: '1.6.1'

      - name: Validate shell and Python syntax
        run: |
          bash -n \
            scripts/m10b/run.sh \
            scripts/m10b/scenario.sh \
            scripts/m10c/run-mixed-diagnostic.sh
          python3 -m py_compile \
            scripts/m10b/runner.py \
            scripts/m10b/analyze.py \
            scripts/m10b/tests/test_runner.py \
            scripts/m10c/collect.py \
            scripts/m10c/jfr.py \
            scripts/m10c/tests/test_collect.py \
            scripts/m10c/tests/test_jmx.py \
            scripts/m10c/tests/test_preflight.py \
            scripts/m10c/tests/test_jfr.py

      - name: Run tooling correctness tests (no benchmarks)
        run: |
          # Require k6 so wrapper/marker tests cannot silently skip in CI.
          k6 version
          python3 -c "import shutil; assert shutil.which('k6'), 'k6 is required in CI'"
          k6 inspect --execution-requirements load-tests/k6/mixed-fleet-diagnostic.js >/dev/null
          python3 -m unittest discover -s scripts/m10b/tests -v
          python3 -m unittest discover -s scripts/m10c/tests -v
          npm --prefix load-tests test

  container-smoke:
    name: Container Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: heimdall-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate ephemeral security configuration
        run: |
          command -v docker curl openssl python3
          docker compose version
          bash -n scripts/dev/generate-compose-env.sh scripts/ci/container-smoke.sh
          bash scripts/dev/generate-compose-env.sh
          test -s .env
          test "$(stat -c '%a' .env)" = 600

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build heimdall

      - name: Start integration stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180 heimdall

      - name: Verify health, Flyway migrations and vehicle API
        run: bash scripts/ci/container-smoke.sh

      - name: Show diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          if [[ -s .env ]]; then
            docker compose ps
            docker compose logs --no-color --tail 200 postgres kafka heimdall
          fi

      - name: Clean up
        if: always()
        timeout-minutes: 2
        run: |
          trap 'rm -f .env' EXIT
          if [[ -s .env ]]; then
            docker compose down --volumes --remove-orphans
          fi

  dashboard:
    name: Operator Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Validate dashboard
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
