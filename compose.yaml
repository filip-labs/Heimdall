services:
  postgres:
    image: postgres:17
    container_name: heimdall-postgres
    environment:
      POSTGRES_DB: heimdall
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: heimdall
    ports:
      - "5433:5432"
    volumes:
      - heimdall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall -d heimdall"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    container_name: heimdall-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  heimdall:
    build:
      context: .
      dockerfile: Dockerfile
    image: heimdall:local
    container_name: heimdall-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/heimdall
      SPRING_DATASOURCE_USERNAME: heimdall
      SPRING_DATASOURCE_PASSWORD: heimdall
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEIMDALL_SECURITY_VEHICLE_TOKEN_SECRET: ${HEIMDALL_SECURITY_VEHICLE_TOKEN_SECRET:?Run scripts/dev/generate-compose-env.sh first}
      HEIMDALL_SECURITY_VEHICLE_TOKEN_TTL: ${HEIMDALL_SECURITY_VEHICLE_TOKEN_TTL:-5m}
      HEIMDALL_SECURITY_RELEASE_SIGNING_PRIVATE_KEY: ${HEIMDALL_SECURITY_RELEASE_SIGNING_PRIVATE_KEY:?Run scripts/dev/generate-compose-env.sh first}
      HEIMDALL_SECURITY_RELEASE_SIGNING_KEY_ID: ${HEIMDALL_SECURITY_RELEASE_SIGNING_KEY_ID:?Run scripts/dev/generate-compose-env.sh first}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    stop_grace_period: 60s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: heimdall-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.4.11
    container_name: heimdall-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  heimdall_postgres_data:
